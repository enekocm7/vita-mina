name: Build and release VPK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VITASDK: /home/runner/vitasdk

jobs:
  release:
    name: Build VPK and create release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            make \
            git-core \
            cmake \
            wget \
            python3 \
            ca-certificates \
            xz-utils \
            bzip2 \
            curl

      - name: Install VitaSDK
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm /tmp/vdpm
          cd /tmp/vdpm
          ./bootstrap-vitasdk.sh
          chmod +x "$VITASDK/bin/pacman"
          ./install-all.sh
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Build VPK
        run: make

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/vita_minesweeper.vpk
          generate_release_notes: true
          fail_on_unmatched_files: true
